# Production stack for the VPS: docker compose -f docker-compose.prod.yml up -d --build
# Apache runs on the host and proxies to the app on 127.0.0.1:3000. The database is reachable only inside Docker.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: https://${DOMAIN}
      AUTH_TRUST_HOST: "true" # we are behind Apache
      AUTH_URL: https://${DOMAIN} # without this, login redirects go to the container's internal 0.0.0.0:3000 address
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000" # only Apache on this host can reach it
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: db
    volumes:
      - backups:/backups

volumes:
  pgdata:
  backups:
