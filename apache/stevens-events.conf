# Apache vhost for Steven's Events. Install as /etc/apache2/sites-available/stevens-events.conf
# Replace YOUR_DOMAIN, then: a2ensite stevens-events && certbot --apache -d YOUR_DOMAIN
# certbot adds the HTTPS (443) vhost and the certificate renewal for you.
<VirtualHost *:80>
	ServerName YOUR_DOMAIN

	ProxyPreserveHost On
	ProxyPass / http://127.0.0.1:3000/
	ProxyPassReverse / http://127.0.0.1:3000/
	RequestHeader set X-Forwarded-Proto "https"

	AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

	Header always set Strict-Transport-Security "max-age=31536000"
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "DENY"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"
</VirtualHost>
